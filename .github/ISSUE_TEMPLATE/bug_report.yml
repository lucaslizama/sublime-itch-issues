name: Bug report
description: Something in Sublime Itch doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time. Please leave out anything private; an itch.io password, cookie or token is never needed here.
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown next to the name at the top of the app, and in About.
      placeholder: "0.1.4"
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - Linux (AppImage)
        - Windows
    validations:
      required: true
  - type: input
    id: details
    attributes:
      label: Which one, more exactly
      placeholder: "Ubuntu 24.04 with GNOME, or Windows 11"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What was done, what was expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Message at the bottom of the window
      description: If the app showed one, paste it here as it is.
      render: text
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots help, cropped to what matters.
